{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="card auth-card mx-auto">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <span class="club-icon mb-2"><i class="bi bi-box-arrow-in-right"></i></span>
                <h3 class="fw-bold">Welcome back</h3>
                <p class="text-muted">Log in to manage your clubs and registrations</p>
            </div>
            <form method="post" class="needs-validation" novalidate>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" value="{{ email }}" placeholder="yourname@student.mes.ac.in" required autofocus>
                    <div class="invalid-feedback">Please enter a valid email.</div>
                </div>
                <div class="mb-4">
                    <label for="login_password" class="form-label">Password</label>
                    <div class="input-group has-validation">
                        <input type="password" class="form-control" id="login_password" name="password" required>
                        <button class="btn btn-outline-secondary" type="button" data-toggle-password="login_password"><i class="bi bi-eye"></i></button>
                        <div class="invalid-feedback">Please enter your password.</div>
                    </div>
                </div>
                <button type="submit" class="btn btn-brand w-100 py-2">Login</button>
            </form>
            <p class="text-center mt-4 mb-0">New here? <a href="{{ url_for('register') }}" class="text-brand">Create an account</a></p>
        </div>
    </div>
</div>
{% endblock %}
