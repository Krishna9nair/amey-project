{% extends "admin/layout.html" %}
{% set active_section = 'admin_club_admins' %}
{% block title %}Edit Club Admin{% endblock %}
{% block admin_content %}
<div class="card hover-card" style="max-width: 620px">
    <div class="card-body p-4">
        <h3 class="fw-bold mb-1">Edit Club Admin</h3>
        <p class="text-muted mb-4">{{ club_admin.club }}</p>
        <form method="post" class="needs-validation" novalidate>
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" name="name" value="{{ form.name }}" minlength="2" required>
                <div class="invalid-feedback">Name is required.</div>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Login Email</label>
                <input type="email" class="form-control" id="email" name="email" value="{{ form.email }}" required>
                <div class="invalid-feedback">Enter a valid email.</div>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">New Password</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="password" name="password" minlength="6" placeholder="Leave blank to keep the current password">
                    <button class="btn btn-outline-secondary" type="button" data-toggle-password="password"><i class="bi bi-eye"></i></button>
                </div>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-brand"><i class="bi bi-save"></i> Save Changes</button>
                <a href="{{ url_for('admin_club_admins') }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
