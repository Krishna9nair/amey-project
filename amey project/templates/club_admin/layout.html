{% extends "base.html" %}
{% block content %}
<div class="page-header no-print">
    <div class="container d-flex align-items-center gap-3">
        <span class="club-icon" style="background: rgba(255,255,255,.2)"><i class="bi bi-{{ category_icons.get(my_club.category, 'star') }}"></i></span>
        <div>
            <h1 class="h3 fw-bold mb-0">{{ my_club.name }}</h1>
            <span class="opacity-75">Club Portal</span>
        </div>
    </div>
</div>
<div class="container">
    <ul class="nav nav-pills mb-4 no-print">
        <li class="nav-item">
            <a class="nav-link {% if request.endpoint in ['club_admin_dashboard', 'club_admin_participants'] %}active bg-brand{% endif %}"
               href="{{ url_for('club_admin_dashboard') }}"><i class="bi bi-calendar-event"></i> Events &amp; Participants</a>
        </li>
        <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'club_admin_memberships' %}active bg-brand{% endif %}"
               href="{{ url_for('club_admin_memberships') }}"><i class="bi bi-person-check"></i> Membership Requests</a>
        </li>
    </ul>
    {% block admin_content %}{% endblock %}
</div>
{% endblock %}
